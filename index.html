<!doctype html>
<html lang="en" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Voice Assistant for Ethiopian SMEs - Real-time sales logging, inventory tracking, and expense management via voice audio streams." />
    <title>Voxide SME Voice Assistant | የንግድ ድምፅ ረዳት</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent FOUC: apply saved theme before first paint -->
    <script>
      (function(){
        var t = localStorage.getItem('birrvoice-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add(t);
        document.documentElement.classList.remove(t === 'dark' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body class="h-full antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
