<!doctype html>
<html lang="en" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BirrVoice Ledger — AI-powered voice assistant for Ethiopian SMEs. Log sales, track inventory and expenses by speaking in Amharic or English. Powered by Voxide AI." />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="keywords" content="BirrVoice, Ethiopian SME, voice assistant, Amharic, business ledger, inventory, sales tracking" />
    <meta name="author" content="BirrVoice" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon.jpg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- PWA / App Install -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BirrVoice" />

    <!-- Open Graph / Rich Preview -->
    <meta property="og:title" content="BirrVoice Ledger — Ethiopian SME Voice Assistant" />
    <meta property="og:description" content="Log sales, track inventory and expenses by speaking in Amharic or English. Powered by Voxide AI. Ethiopia's voice-first business ledger." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BirrVoice Ledger — The Voice of Your Business" />
    <meta property="og:url" content="https://birrvoice.app" />
    <meta property="og:site_name" content="BirrVoice Ledger" />
    <meta property="og:locale" content="am_ET" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BirrVoice Ledger — Ethiopian SME Voice Assistant" />
    <meta name="twitter:description" content="Log sales, track inventory and expenses by speaking in Amharic or English. Powered by Voxide AI." />
    <meta name="twitter:image" content="/og-card.jpg" />

    <title>BirrVoice Ledger | Voxide SME Voice Assistant | የኢትዮጵያ ንግድ ድምፅ ረዳት</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevent FOUC: apply saved theme before first paint -->
    <script>
      (function(){
        var t = localStorage.getItem('birrvoice-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add(t);
        document.documentElement.classList.remove(t === 'dark' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body class="h-full antialiased selection:bg-teal-500/30 selection:text-teal-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[SW] Registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
