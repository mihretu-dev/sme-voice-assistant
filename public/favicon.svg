<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccfbf1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" />

  <!-- Mic body -->
  <rect x="24" y="10" width="16" height="24" rx="8" fill="url(#mic-grad)" />

  <!-- Mic stand arc -->
  <path d="M18 30 C18 44 46 44 46 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mic stand pole -->
  <line x1="32" y1="44" x2="32" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Mic base -->
  <line x1="24" y1="52" x2="40" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Sound wave lines (left) -->
  <line x1="12" y1="28" x2="12" y2="36" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="8"  y1="26" x2="8"  y2="38" stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.50"/>

  <!-- Sound wave lines (right) -->
  <line x1="52" y1="28" x2="52" y2="36" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="56" y1="26" x2="56" y2="38" stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.50"/>
</svg>